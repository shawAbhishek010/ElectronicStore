spring.application.name=SparkGadget
server.port=8081

#Database configuration

spring.datasource.url=jdbc:mysql://localhost:3306/electronicStore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Abhishek1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP keeps MySQL connections healthy and replaces them before MySQL closes idle sockets.
spring.datasource.hikari.pool-name=SparkGadgetHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=0

#jpa/hibernate configuration

spring.jpa.hibernate.ddl-auto= update
# its types: none, update,create, create-drop
spring.jpa.show-sql = true
#dialect: It is a Spring Boot application property that sets the Hibernate SQL dialect to be used when connecting to a MySQL database.
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# Product image storage
product.image.path = images/products/
# file config
spring.servlet.multipart.max-file-size=10MB

# JWT configuration
# jwt.secret signs tokens; JWT_SECRET environment variable should be changed for every real deployment.
jwt.secret=${JWT_SECRET:electronic-store-local-development-secret-change-me-1234567890}
# Token validity time in milliseconds. 3600000 = 1 hour.
jwt.expiration-ms=3600000

# Admin portal 2-step password.
# Change ADMIN_PORTAL_PASSWORD in your environment before using this outside local development.
admin.portal.password=${ADMIN_PORTAL_PASSWORD:Admin@123}

# Razorpay payment configuration
# The key id is safe to send to the frontend. Keep RAZORPAY_KEY_SECRET only on the backend.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TEEQqaLhMCwZcj}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:9RfxxT8LekZfL6iI79B9XlQu}
razorpay.currency=INR
