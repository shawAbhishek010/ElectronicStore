spring.application.name=SparkGadget
server.port=${PORT:8081}

# Database configuration
# Railway MySQL provides MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, and MYSQLPASSWORD.
# For any other host, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD.
app.database.host=${MYSQLHOST:localhost}
app.database.port=${MYSQLPORT:3306}
app.database.name=${MYSQLDATABASE:${MYSQL_DATABASE:electronicStore}}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${app.database.host}:${app.database.port}/${app.database.name}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP keeps MySQL connections healthy and replaces them before MySQL closes idle sockets.
spring.datasource.hikari.pool-name=SparkGadgetHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=0

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Product image storage
# Railway containers are ephemeral. Use a persistent volume and set PRODUCT_IMAGE_PATH if uploads must survive redeploys.
product.image.path=${PRODUCT_IMAGE_PATH:images/products/}

# File upload configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# JWT configuration
# Set JWT_SECRET in Railway. Use a long random value, at least 32 characters.
jwt.secret=${JWT_SECRET:change-this-local-development-jwt-secret-32chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Admin portal 2-step password. Set ADMIN_PORTAL_PASSWORD in Railway.
admin.portal.password=${ADMIN_PORTAL_PASSWORD:}

# CORS configuration. Add the deployed frontend URL in Railway with CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,https://electronic-store-cl97e5421-shawabhishek010s-projects.vercel.app,https://electronic-store-sooty.vercel.app}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}

# Razorpay payment configuration. Keep both values only in backend environment variables.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=${RAZORPAY_CURRENCY:INR}

# Groq assistant configuration. Keep GROQ_API_KEY only in backend environment variables.
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
